AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: free-tier-auth - a Cognito user pool on the Lite tier and the GitHub bridge's triggers.

# GitHub users sign in through the custom-auth bridge, so they count as direct users (10,000 a month free). There is deliberately
# no OIDC provider here: federated users get only 50 free. A social provider (Google) can be added beside it later.
# Include it from a project's stack (AWS::Serverless::Application or AWS::CloudFormation::Stack), or deploy it on its own.

Parameters:
  BridgeSecretParameter:
    Type: String
    Description: The SSM SecureString parameter holding the GitHub bridge's secret, shared by the server and the triggers.

Resources:
  Triggers:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/triggers.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 5
      Environment:
        Variables:
          BRIDGE_SECRET_PARAMETER: !Ref BridgeSecretParameter
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${BridgeSecretParameter}

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolTier: LITE
      UsernameConfiguration: { CaseSensitive: false }
      # Nobody signs up by themselves; the pre-sign-up trigger says so too.
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      AccountRecoverySetting: { RecoveryMechanisms: [{ Name: admin_only, Priority: 1 }] }
      LambdaConfig:
        PreSignUp: !GetAtt Triggers.Arn
        DefineAuthChallenge: !GetAtt Triggers.Arn
        CreateAuthChallenge: !GetAtt Triggers.Arn
        VerifyAuthChallengeResponse: !GetAtt Triggers.Arn

  TriggersPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Triggers
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      # Custom auth is the GitHub bridge, run by the server with the client's secret; refresh keeps sessions honest.
      ExplicitAuthFlows: [ALLOW_CUSTOM_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits: { RefreshToken: days, AccessToken: minutes, IdToken: minutes }

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  ClientId:
    Value: !Ref Client
