AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Overworld - a zoomable, Google-Maps-style view of a project (Lambda Function URL + DynamoDB).

Parameters:
  AccessKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret the web app sends with every API call.
  Stage:
    Type: String
    Default: production
    AllowedValues: [production, preview]
    Description: A preview (#27) is small and short-lived; production is the default.
  PermissionsBoundary:
    Type: String
    Default: ''
    Description: The boundary CI's deploys put on the function's role, so CI can't grant more than the app needs. Empty for local deploys.
  GitHubAppId:
    Type: String
    Default: ''
    Description: The GitHub App sync writes as (#3). Empty turns sync off, as in previews and local deploys.
  GitHubInstallationId:
    Type: String
    Default: ''
  GitHubAppSlug:
    Type: String
    Default: ''

Conditions:
  IsPreview: !Equals [!Ref Stage, preview]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundary, '']]
  HasGitHubApp: !And [!Not [!Equals [!Ref GitHubAppId, '']], !Not [!Equals [!Ref GitHubInstallationId, '']]]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      # Single-table design; the keys and access patterns are in api/model/README.md.
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      # A newly saved item (the outbox, #3) wakes the worker through the stream; reading it costs nothing while idle.
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      Tags:
        - { Key: app, Value: projectmap }

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Overworld web app and API
      CodeUri: .build/lambda/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 30
      # Previews are capped so three of them can't take production's capacity.
      ReservedConcurrentExecutions: !If [IsPreview, 2, 10]
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ACCESS_KEY: !Ref AccessKey
          NODE_OPTIONS: --enable-source-maps
          GITHUB_APP_ID: !If [HasGitHubApp, !Ref GitHubAppId, '']
          GITHUB_INSTALLATION_ID: !If [HasGitHubApp, !Ref GitHubInstallationId, '']
          GITHUB_APP_SLUG: !Ref GitHubAppSlug
          # The App's private key and webhook secret: SecureString parameters, put there once (scripts/github-app-secrets.mjs).
          GITHUB_APP_SSM_PREFIX: !Sub /${AWS::StackName}/github-app
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
          SCHEDULE_PREFIX: !Ref AWS::StackName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - SSMParameterReadPolicy:
            ParameterName: !Sub ${AWS::StackName}/github-app/*
        - Statement:
            # One-off retry schedules for this stack's sync, which delete themselves after running.
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule]
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AWS::StackName}-sync-*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
      Events:
        SyncJobs:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            # Sync handles GitHub's outages itself; these retries are for crashes, and then the dead-letter queue.
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"entity":{"S":["job"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt SyncDeadLetters.Arn
        Nightly:
          Type: Schedule
          Properties:
            # SYNC-04: every night (02:00 or 03:00 in Toronto), the map and GitHub agree again.
            Schedule: cron(0 7 * * ? *)
            Input: '{"overworld":"reconcile"}'
            State: !If [HasGitHubApp, ENABLED, DISABLED]
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Tags:
        app: projectmap
        stage: !Ref Stage

  # Where sync's retry schedules get their permission to wake the function, and nothing more.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      Policies:
        - PolicyName: invoke-sync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*
      Tags:
        - { Key: app, Value: projectmap }

  # Stream batches that kept failing. Nobody polls it, so it costs nothing; messages go after 14 days.
  SyncDeadLetters:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: app, Value: projectmap }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppFunction}
      RetentionInDays: !If [IsPreview, 3, 14]

Outputs:
  Url:
    Description: Overworld URL
    Value: !GetAtt AppFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref Table
  FunctionName:
    Value: !Ref AppFunction
  SyncDeadLetters:
    Value: !Ref SyncDeadLetters
